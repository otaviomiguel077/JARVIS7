<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #181818;
      font-size: 24px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .mensagem {
      margin-bottom: 15px;
      padding: 12px 15px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.4;
    }

    .voce {
      background: #2563eb;
      margin-left: auto;
    }

    .jarvis {
      background: #292929;
      margin-right: auto;
    }

    #entrada {
      display: flex;
      padding: 15px;
      background: #181818;
      gap: 10px;
    }

    #mensagem {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <header>🤖 JARVIS</header>

  <div id="chat">
    <div class="mensagem jarvis">
      Olá! Eu sou o JARVIS. Como posso ajudar?
    </div>
  </div>

  <div id="entrada">
    <input
      id="mensagem"
      type="text"
      placeholder="Digite sua mensagem..."
      autocomplete="off"
    >

    <button onclick="enviar()">Enviar</button>
  </div>

  <script>
    async function enviar() {
      const campo = document.getElementById("mensagem");
      const texto = campo.value.trim();

      if (!texto) return;

      adicionarMensagem(texto, "voce");
      campo.value = "";

      try {
        const resposta = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            mensagem: texto
          })
        });

        const dados = await resposta.json();

        if (dados.resposta) {
          adicionarMensagem(dados.resposta, "jarvis");
        } else {
          adicionarMensagem("Erro: " + dados.erro, "jarvis");
        }

      } catch (erro) {
        adicionarMensagem(
          "Não consegui conectar ao servidor.",
          "jarvis"
        );
      }
    }

    function adicionarMensagem(texto, tipo) {
      const chat = document.getElementById("chat");

      const div = document.createElement("div");
      div.className = "mensagem " + tipo;
      div.textContent = texto;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("mensagem").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        enviar();
      }
    });
  </script>

</body>
</html>
