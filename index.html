<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS 7</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #102b38 0%, #061218 35%, #020608 75%);
  color: #d9faff;
  font-family: Arial, sans-serif;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 70px;
  padding: 0 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(0,217,255,.2);
}

.logo {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-icon {
  width: 42px;
  height: 42px;
  border: 2px solid #00d9ff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #00d9ff;
  box-shadow: 0 0 15px #00d9ff;
}

.logo h1 {
  letter-spacing: 5px;
}

.status {
  color: #61ffad;
  font-size: 12px;
  letter-spacing: 2px;
}

main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1.4fr 1fr;
  gap: 20px;
  padding: 20px;
}

.panel {
  border: 1px solid rgba(0,217,255,.2);
  background: rgba(4,15,20,.65);
  border-radius: 14px;
  backdrop-filter: blur(10px);
}

.title {
  padding: 15px;
  color: #00d9ff;
  font-size: 11px;
  letter-spacing: 2px;
  border-bottom: 1px solid rgba(0,217,255,.15);
}

.info {
  padding: 20px;
}

.row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 22px;
  font-size: 13px;
}

.online {
  color: #61ffad;
}

.core-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.core {
  width: 280px;
  height: 280px;
  position: relative;
  display: grid;
  place-items: center;
}

.ring {
  position: absolute;
  border: 1px solid #00d9ff;
  border-radius: 50%;
  box-shadow: 0 0 15px rgba(0,217,255,.5);
}

.r1 {
  width: 100%;
  height: 100%;
  animation: spin 12s linear infinite;
}

.r2 {
  width: 75%;
  height: 75%;
  border-style: dashed;
  animation: spinReverse 8s linear infinite;
}

.r3 {
  width: 50%;
  height: 50%;
  animation: spin 5s linear infinite;
}

.center {
  width: 30%;
  height: 30%;
  border-radius: 50%;
  background: radial-gradient(circle, white, #00d9ff 35%, #006b80);
  box-shadow: 0 0 40px #00d9ff;
  animation: pulse 2s infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes spinReverse {
  to { transform: rotate(-360deg); }
}

@keyframes pulse {
  50% { transform: scale(1.15); }
}

.core-text {
  margin-top: 25px;
  text-align: center;
}

.core-text strong {
  display: block;
  font-size: 20px;
  letter-spacing: 5px;
}

.core-text span {
  color: #00d9ff;
  font-size: 10px;
  letter-spacing: 3px;
}

.chat {
  display: flex;
  flex-direction: column;
  min-height: 500px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: 90%;
  padding: 12px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
}

.jarvis-message {
  align-self: flex-start;
  border-left: 2px solid #00d9ff;
  background: rgba(0,217,255,.08);
}

.user-message {
  align-self: flex-end;
  border-right: 2px solid #61ffad;
  background: rgba(97,255,173,.08);
}

.input-area {
  display: flex;
  gap: 8px;
  padding: 14px;
  border-top: 1px solid rgba(0,217,255,.15);
}

#messageInput {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid rgba(0,217,255,.3);
  border-radius: 8px;
  outline: none;
  background: #030a0e;
  color: white;
}

button {
  width: 48px;
  border: 1px solid #00d9ff;
  border-radius: 8px;
  background: rgba(0,217,255,.08);
  color: #00d9ff;
  cursor: pointer;
  font-size: 18px;
}

button:hover {
  background: rgba(0,217,255,.25);
  box-shadow: 0 0 15px rgba(0,217,255,.4);
}

#micButton.listening {
  border-color: #ff3b5c;
  color: #ff3b5c;
  box-shadow: 0 0 15px #ff3b5c;
}

footer {
  text-align: center;
  padding: 10px;
  color: #41616b;
  font-size: 9px;
  letter-spacing: 2px;
}

@media (max-width: 1000px) {
  main {
    grid-template-columns: 1fr;
  }

  .system-info {
    display: none;
  }
}

@media (max-width: 600px) {
  header {
    padding: 0 15px;
  }

  .logo h1 {
    font-size: 17px;
  }

  .core {
    width: 220px;
    height: 220px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">
    <div class="logo-icon">J7</div>
    <h1>JARVIS 7</h1>
  </div>

  <div class="status">
    â— SYSTEM ONLINE
  </div>
</header>

<main>

<section class="panel system-info">
  <div class="title">SYSTEM STATUS</div>

  <div class="info">
    <div class="row">
      <span>JARVIS CORE</span>
      <span class="online">ONLINE</span>
    </div>

    <div class="row">
      <span>GEMINI AI</span>
      <span class="online">CONNECTED</span>
    </div>

    <div class="row">
      <span>SERVER</span>
      <span class="online">ONLINE</span>
    </div>

    <div class="row">
      <span>VERSION</span>
      <span>7.0</span>
    </div>
  </div>
</section>

<section class="core-area">

  <div class="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="center"></div>
  </div>

  <div class="core-text">
    <strong>JARVIS</strong>
    <span>ARTIFICIAL INTELLIGENCE</span>
  </div>

</section>

<section class="panel chat">

  <div class="title">
    JARVIS COMMUNICATION
  </div>

  <div id="messages">

    <div class="message jarvis-message">
      OlÃ¡. Eu sou o JARVIS 7. Todos os sistemas estÃ£o operacionais.
      Como posso ajudar?
    </div>

  </div>

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Digite ou fale com JARVIS..."
      autocomplete="off"
    >

    <button id="micButton" title="Falar com JARVIS">
      ðŸŽ™ï¸
    </button>

    <button id="sendButton">
      âž¤
    </button>

  </div>

</section>

</main>

<footer>
JARVIS 7 â€¢ PERSONAL ARTIFICIAL INTELLIGENCE SYSTEM
</footer>

</div>

<script>

const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const messages = document.getElementById("messages");


function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type + "-message";

  message.textContent = text;

  messages.appendChild(message);

  messages.scrollTop = messages.scrollHeight;
}


async function sendMessage() {

  const mensagem = input.value.trim();

  if (!mensagem) return;

  addMessage(mensagem, "user");

  input.value = "";

  sendButton.disabled = true;

  try {

    const response = await fetch("/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        mensagem: mensagem
      })

    });

    const data = await response.json();

    if (!response.ok) {

      throw new Error(
        data.erro ||
        data.error ||
        "Erro ao comunicar com o JARVIS."
      );

    }

    addMessage(data.resposta, "jarvis");

    falar(data.resposta);

  } catch (error) {

    addMessage(
      "Erro de comunicaÃ§Ã£o: " + error.message,
      "jarvis"
    );

  } finally {

    sendButton.disabled = false;

    input.focus();

  }
}


/* VOZ DO JARVIS */

function falar(texto) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const voz = new SpeechSynthesisUtterance(texto);

  voz.lang = "pt-BR";
  voz.rate = 1;
  voz.pitch = 0.9;
  voz.volume = 1;

  window.speechSynthesis.speak(voz);
}



// ENVIO DE MENSAGENS
sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    sendMessage();
  }
});

// RECONHECIMENTO DE VOZ
const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();

  recognition.lang = "pt-BR";
  recognition.continuous = false;
  recognition.interimResults = false;

  let ouvindo = false;

  micButton.addEventListener("click", () => {
    if (ouvindo) return;

    try {
      recognition.start();
    } catch (error) {
      console.error("Erro ao iniciar microfone:", error);
      addMessage("Não consegui iniciar o microfone. Tente novamente.", "jarvis");
    }
  });

  recognition.onstart = () => {
    ouvindo = true;
    micButton.classList.add("listening");
    micButton.textContent = "🔴";
  };

  recognition.onresult = async (event) => {
    const texto = event.results[0][0].transcript.trim();

    if (!texto) return;

    input.value = texto;
    await sendMessage();
  };

  recognition.onerror = (event) => {
    console.error("Erro no reconhecimento:", event.error);
    addMessage("Erro no reconhecimento de voz: " + event.error, "jarvis");
  };

  recognition.onend = () => {
    ouvindo = false;
    micButton.classList.remove("listening");
    micButton.textContent = "🎙️";
  };
} else {
  micButton.addEventListener("click", () => {
    addMessage("O reconhecimento de voz não é compatível com este navegador.", "jarvis");
  });
}
</script>
</body>
</html>


</html>
